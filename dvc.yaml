stages:
  prepare:
    cmd: python prepare.py
    deps:
    - prepare.py
    outs:
    - data/prepared.csv
  featurize:
    cmd: python featurize.py
    deps:
    - featurize.py
    - data/prepared.csv
    outs:
    - data/features.csv
  train:
    cmd: python train.py
    deps:
    - train.py
    - data/features.csv
    outs:
    - models/model.pkl
  evaluate:
    cmd: python evaluate.py
    deps:
    - evaluate.py
    - models/model.pkl
    - data/features.csv
    metrics:
    - metrics.txt:
        cache: false
